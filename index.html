<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wawera — uma nova experiência digital.">
  <title>Wawera!</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 760px;
      text-align: center;
      padding: 60px 28px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 30px;
      background: rgba(255,255,255,0.06);
      box-shadow: 0 25px 70px rgba(0,0,0,0.35);
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 25px;
      border-radius: 24px;
      background: white;
      color: #0b1020;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
    }

    h1 {
      font-size: clamp(48px, 12vw, 82px);
      line-height: 1;
      margin-bottom: 18px;
      letter-spacing: -3px;
    }

    p {
      max-width: 560px;
      margin: 0 auto;
      color: rgba(255,255,255,0.78);
      font-size: 18px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 32px;
      padding: 15px 25px;
      border-radius: 15px;
      background: white;
      color: #0b1020;
      text-decoration: none;
      font-weight: 800;
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <main>
    <div class="logo">W!</div>

    <h1>Wawera!</h1>

    <p>
      Uma nova experiência está a nascer.
      Este é o primeiro passo da nossa aplicação.
    </p>

    <a href="#" class="button">Começar</a>
  </main>
</body>
</html>
